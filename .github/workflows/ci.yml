name: Verify extension and plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -- --force
      - run: npm test
      - run: npm run build
      - run: node scripts/probe-native-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: frameforge-builds
          path: |
            apps/chrome-extension/dist
            apps/figma-plugin/dist
