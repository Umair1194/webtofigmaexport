<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrameForge Importer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
    }

    p.subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px 10px;
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s ease;
      margin-top: 12px;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.05);
    }

    .status-box {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 12px;
    }

    .status-box.active {
      display: block;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #34d399;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #f87171;
    }

    .status-progress {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--accent);
      color: #818cf8;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    .stat-val {
      font-weight: 600;
      color: white;
      font-size: 13px;
    }

    .warnings-list {
      margin-top: 10px;
      font-size: 11px;
      color: var(--warning);
      max-height: 80px;
      overflow-y: auto;
      padding-left: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">FF</div>
    <div>
      <h1>FrameForge Importer</h1>
      <p class="subtitle">Convert captured web scenes into native Figma layers</p>
    </div>
  </div>

  <div class="card">
    <button class="btn btn-primary" id="btn-paste-clipboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      </svg>
      Import from Clipboard
    </button>

    <div class="dropzone" id="dropzone">
      <span>Drop .json capture file here or click to browse</span>
      <input type="file" id="file-input" accept=".json" style="display: none;">
    </div>
  </div>

  <div class="status-box" id="status-box"></div>

  <script>
    const btnPaste = document.getElementById('btn-paste-clipboard');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const statusBox = document.getElementById('status-box');

    function setStatus(type, html) {
      statusBox.className = `status-box active status-${type}`;
      statusBox.innerHTML = html;
    }

    async function processJsonString(jsonStr) {
      try {
        const payload = JSON.parse(jsonStr);
        setStatus('progress', 'Parsing scene graph and pre-loading fonts...');
        parent.postMessage({ pluginMessage: { type: 'IMPORT_SCENE_GRAPH', payload } }, '*');
      } catch (err) {
        setStatus('error', `Failed to parse JSON: ${err.message}`);
      }
    }

    btnPaste.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text || !text.trim().startsWith('{')) {
          setStatus('error', 'Clipboard does not contain a valid FrameForge scene graph JSON. Please capture a page with the FrameForge Chrome extension first.');
          return;
        }
        await processJsonString(text);
      } catch (err) {
        setStatus('error', 'Unable to read clipboard. You can drag and drop the downloaded .json file below instead.');
      }
    });

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => processJsonString(evt.target.result);
        reader.readAsText(file);
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => processJsonString(evt.target.result);
        reader.readAsText(file);
      }
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'IMPORT_PROGRESS') {
        setStatus('progress', msg.message);
      } else if (msg.type === 'IMPORT_SUCCESS') {
        const s = msg.stats;
        let warningsHtml = '';
        if (s.warnings && s.warnings.length > 0) {
          warningsHtml = `
            <div style="margin-top: 8px; font-weight: 600;">Font / Asset Diagnostics:</div>
            <ul class="warnings-list">
              ${s.warnings.map(w => `<li>${w}</li>`).join('')}
            </ul>
          `;
        }

        setStatus('success', `
          <div style="font-weight: 600; font-size: 13px; margin-bottom: 6px;">
            🎉 Successfully reconstructed in ${s.durationMs}ms!
          </div>
          <div><strong>${s.title || 'Page'}</strong></div>
          <div class="stats-grid">
            <div class="stat-pill">Total Nodes: <span class="stat-val">${s.totalNodes}</span></div>
            <div class="stat-pill">Text Layers: <span class="stat-val">${s.textNodes}</span></div>
            <div class="stat-pill">Frames & Auto Layout: <span class="stat-val">${s.frames}</span></div>
            <div class="stat-pill">Images & Vectors: <span class="stat-val">${s.images + s.vectors}</span></div>
          </div>
          ${warningsHtml}
        `);
      } else if (msg.type === 'IMPORT_ERROR') {
        setStatus('error', `Import Error: ${msg.error}`);
      }
    };
  </script>
</body>
</html>
